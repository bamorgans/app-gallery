<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ronan’s Playbook</title>
<style>
/* =====================================================================
 * 1. DESIGN TOKENS — the single source of truth.
 *    CSS uses them directly; the field (SVG) reads the same tokens in JS,
 *    so changing a color here restyles the UI and the animation together.
 * ===================================================================== */
:root{
  /* Brand */
  --red:#AA0000; --red-dark:#850000; --gold:#B3995D; --gold-dark:#705b2e;
  /* Field & game pieces */
  --grass:#236b3b; --route:#29a0ff; --sun:#ffd45a; --rush:#ff9f1c;
  --zone:#c81d25; --zone-ink:#5a0d12; --endzone-own:#7a1018; --endzone-opp:#B3995D;
  --qb:#13283e; --db:#e54b4b; --def:#f3f5f7; --ball:#8b4a1f; --halo:#0b2a17;
  /* Status */
  --go:#1f9d55; --stop:#d62828;
  /* Surfaces & text */
  --ink:#20252b; --muted:#66717e; --paper:#f3f4f6; --card:#ffffff; --border:#e0e4e8; --dark:#101820; --deep:#0b1117;
  --glass:rgba(255,255,255,.10); --glass-line:rgba(255,255,255,.22);
  --scrim:rgba(11,17,23,.55); --scrim-strong:rgba(11,17,23,.9);
  --shadow:0 10px 30px rgba(16,24,32,.16);
  /* Type */
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs-xs:.72rem; --fs-sm:.82rem; --fs-md:.92rem; --fs-lg:1.15rem; --fs-xl:1.45rem;
  /* Space & shape */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:34px;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-pill:999px;
  --tap:44px; --fade:350ms;
  /* Safe zone: device insets (notches, home bars) but never less than a comfortable gutter.
     The gutter keeps controls clear of rounded corners and the Android / Fire OS edge-swipe
     gestures (back from the sides, system bar from the bottom). It scales with the screen:
     ~12px on phones, up to 32px on an 8–10" tablet like the Fire HD 8. */
  --gutter-x:clamp(12px,2.5vw,32px);
  --gutter-y:clamp(8px,2vh,24px);
  --inset-t:env(safe-area-inset-top,0px); --inset-b:env(safe-area-inset-bottom,0px);
  --inset-l:env(safe-area-inset-left,0px); --inset-r:env(safe-area-inset-right,0px);
  --safe-t:max(var(--gutter-y),var(--inset-t)); --safe-b:max(var(--gutter-y),var(--inset-b));
  --safe-l:max(var(--gutter-x),var(--inset-l)); --safe-r:max(var(--gutter-x),var(--inset-r));
}

/* ===== 2. Base ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--font)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

/* ===== 3. Components (reused everywhere) ===== */
/* Button: one base, small set of variants */
.btn{min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  padding:6px var(--s3);border:1px solid transparent;border-radius:var(--r-md);background:none;
  font-size:var(--fs-sm);font-weight:800;line-height:1.15;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn--glass{background:var(--glass);border-color:var(--glass-line);color:#fff}
.btn--primary{background:var(--red);border-color:var(--red);color:#fff}
.btn--gold{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.btn--toggle[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.btn--pill{border-radius:var(--r-pill)}
.btn--block{width:100%}
.btn--choice[aria-pressed="true"],.btn--choice[aria-selected="true"]{background:#fff;border-color:#fff;color:var(--dark)}
.btn .ico{font-size:1.05rem;line-height:1}
/* Status dot used on drive-location pills */
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--go);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.dot--stop::before{background:var(--stop)}
/* Badge */
.badge{flex:0 0 auto;font-weight:900;font-size:var(--fs-xs);letter-spacing:.06em;border-radius:var(--r-pill);padding:6px 10px;white-space:nowrap}
.badge--stop{background:var(--stop);color:#fff}
.badge--go{background:var(--go);color:#fff}
.badge--neutral{background:var(--gold);color:var(--dark)}
/* Rail: horizontal scroller that bleeds to the container edge but rests inside the safe zone */
.rail{display:flex;gap:var(--s2);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  scrollbar-width:none;padding-block:2px;
  margin-left:calc(-1 * var(--pad-l,0px));margin-right:calc(-1 * var(--pad-r,0px));
  padding-left:var(--pad-l,0px);padding-right:var(--pad-r,0px);
  scroll-padding-left:var(--pad-l,0px);scroll-padding-right:var(--pad-r,0px)}
.rail::-webkit-scrollbar{display:none}
.rail > *{flex:0 0 auto}
/* Tile: play card (name only; the selected tile adds thumbnail + short description) */
.tile{min-height:58px;justify-content:flex-start;gap:var(--s3);padding:var(--s2) var(--s4);text-align:left;font-size:var(--fs-md)}
.tile .tile-thumb,.tile .tile-desc{display:none}
.tile[aria-pressed="true"]{background:rgba(170,0,0,.92);border-color:var(--sun);padding:6px var(--s3) 6px 6px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.tile[aria-pressed="true"] .tile-thumb{display:grid}
.tile[aria-pressed="true"] .tile-desc{display:block;width:150px;margin-top:2px;font-size:var(--fs-xs);font-weight:600;line-height:1.25;color:#ffe7e7;white-space:normal}
.tile-thumb{width:46px;height:46px;place-items:center;background:var(--grass);border-radius:var(--r-sm);font-size:1.5rem;overflow:hidden}
.tile-thumb svg{width:40px;height:44px;display:block}

/* ===== 4. Layout ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(243,244,246,.94);border-bottom:1px solid var(--border);
  padding:calc(var(--inset-t) + var(--s2)) var(--safe-r) var(--s2) var(--safe-l)}
.topbar-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.brand{font-weight:900;font-size:1.05rem;letter-spacing:-.02em;display:flex;align-items:center;gap:var(--s2)}
.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-size:.8rem;font-style:italic;border:2px solid var(--gold)}
.tabs{display:inline-flex;gap:var(--s1);padding:var(--s1);background:#e1e5e9;border-radius:var(--r-pill)}
.tabs .btn{color:#4a535d;font-size:var(--fs-md);padding:var(--s2) var(--s4)}
.tabs .btn[aria-selected="true"]{background:#fff;color:var(--red);box-shadow:0 2px 8px rgba(16,24,32,.15)}
@media(max-width:430px){.brand-text{display:none}.tabs{flex:1}.tabs .btn{flex:1;padding:var(--s2) 6px;font-size:.86rem}}
main{max-width:1440px;margin:0 auto;display:grid;gap:var(--s3);
  padding:var(--s3) var(--safe-r) var(--safe-b) var(--safe-l);
  grid-template-columns:minmax(0,1fr);grid-template-areas:"player" "info"}
@media(min-width:900px){main{gap:18px;align-items:start;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);grid-template-areas:"player info"}}

/* ===== 5. Player — the same parts in page view and full screen ===== */
.player{grid-area:player;min-width:0;background:var(--deep);color:#fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);
  --pad-l:var(--s3); --pad-r:var(--s3)}
.stage{position:relative;display:flex;flex-direction:column}
.hud-top{order:0;padding:var(--s3) var(--pad-r) var(--s2) var(--pad-l);transition:opacity var(--fade)}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
/* App mode button (top bar, touch devices that support full screen) */
.app-mode{background:#fff;border-color:var(--border);color:var(--dark);font-size:1.15rem}
.app-mode[hidden]{display:none}
@media(max-width:430px){.topbar-inner{flex-wrap:nowrap}}
/* Top-right actions: status badge, then the full-screen / close button */
.hud-actions{flex:0 0 auto;display:flex;align-items:center;gap:var(--s2)}
.btn--icon{width:var(--tap);padding:0;border-radius:50%}
.btn--icon .lbl{display:none}
.player.is-full .hud-actions .btn--glass{background:var(--scrim)}
.hud-title{margin:0;font-size:var(--fs-lg);letter-spacing:-.02em;line-height:1.2}
.hud-desc{margin:6px 0 0;min-height:1.35em;font-size:var(--fs-md);line-height:1.35;color:#dfe4e8}
.field-wrap{order:1;background:var(--deep)}
.field{display:block;width:100%;height:auto;aspect-ratio:640/350;max-height:68vh;font-family:var(--font)}
.subtitle{display:none}
.hud-bottom{order:2;display:grid;gap:var(--s2);grid-template-columns:minmax(0,1fr);grid-template-areas:"spots" "cards" "controls";
  padding:var(--s2) var(--pad-r) var(--s3) var(--pad-l);transition:opacity var(--fade)}
.spots{grid-area:spots}
.spots[hidden]{display:none}
.spots .btn{min-height:38px;font-size:var(--fs-sm)}
.cards{grid-area:cards}
.controls{grid-area:controls;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.controls .btn{padding:6px 4px}
@media(max-width:520px){.controls .btn{flex-direction:column;gap:2px;font-size:.68rem;padding:4px 2px}}

/* Full screen: a video-game HUD over the field.
   Field fills the screen; HUD floats on a scrim inside the safe zone.
   During a play the HUD fades so the animation is never covered (see HUD in the script). */
.player.is-full{position:fixed;inset:0;z-index:1000;border-radius:0;box-shadow:none;background:#000;
  --pad-l:var(--safe-l); --pad-r:var(--safe-r)}
.player.is-full .stage{position:absolute;inset:0}
.player.is-full .field-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
.player.is-full .field{width:100%;height:100%;max-height:none;aspect-ratio:auto}
.player.is-full .hud-top{position:absolute;top:0;left:0;right:0;z-index:2;padding:var(--safe-t) var(--pad-r) var(--s6) var(--pad-l);
  background:linear-gradient(var(--scrim-strong),var(--scrim) 60%,transparent)}
.player.is-full .hud-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:var(--s6) var(--pad-r) var(--safe-b) var(--pad-l);
  background:linear-gradient(to top,var(--scrim-strong),var(--scrim) 65%,transparent)}
.player.is-full .controls{display:flex;justify-content:flex-end;gap:var(--s2)}
.player.is-full .controls .btn{width:var(--tap);height:var(--tap);padding:0;border-radius:50%}
.player.is-full .controls .btn--glass:not([aria-pressed="true"]),.player.is-full .rail .btn--glass:not([aria-pressed="true"]){background:var(--scrim)}
.player.is-full .controls .lbl{display:none}
.player.is-full .controls .ico{font-size:1.15rem}
.player.is-full.hud-hidden .hud-top,.player.is-full.hud-hidden .hud-bottom{opacity:0;pointer-events:none}
.player.is-full .subtitle{display:block;position:absolute;z-index:1;left:50%;bottom:var(--safe-b);transform:translateX(-50%);
  width:max-content;max-width:min(88%,620px);padding:6px var(--s3);border-radius:var(--r-sm);background:rgba(11,17,23,.72);
  color:#fff;font-weight:750;font-size:clamp(.95rem,2.2vmin,1.2rem);line-height:1.35;text-align:center;pointer-events:none;opacity:0;transition:opacity var(--fade)}
.player.is-full.hud-hidden .subtitle:not(:empty){opacity:1}
/* First-run tip: how to leave full screen. Glass panel at the top, fades on its own or via ✕. */
.fs-hint{display:none}
.player.is-full .fs-hint:not([hidden]){display:flex;align-items:center;gap:var(--s3);position:absolute;z-index:3;
  top:var(--safe-t);left:50%;transform:translateX(-50%);width:max-content;max-width:min(92%,580px);
  padding:6px 6px 6px var(--s4);border-radius:var(--r-lg);border:1px solid var(--glass-line);
  background:rgba(11,17,23,.92);box-shadow:0 8px 24px rgba(0,0,0,.4);color:#fff;
  font-weight:750;font-size:clamp(.88rem,2vmin,1.05rem);line-height:1.3;transition:opacity .3s}
.fs-hint b{color:var(--sun)}
.fs-hint.is-fading{opacity:0}
.fs-hint-x{flex:0 0 auto;width:var(--tap);padding:0}
/* Coach card (full screen, while a play runs): ONE card — progress dots + the current step.
   It is placed automatically in the screen corner the play uses least (placeCoachCard), so it
   doesn't sit on the action or on field labels; the narration subtitle takes the opposite edge.
   Text scales with the screen: 16px on phones up to ~22px on a Fire HD 8. */
.step-hud{display:none}
.player.is-full .step-hud{--fs-step:clamp(1rem,2.6vmin,1.4rem);display:block;position:absolute;z-index:1;
  width:min(40%,420px);pointer-events:none;opacity:0;transition:opacity var(--fade);top:var(--safe-t);right:var(--pad-r)}
.player.is-full .step-hud.pos-tl{top:var(--safe-t);left:var(--pad-l);right:auto;bottom:auto}
.player.is-full .step-hud.pos-tr{top:var(--safe-t);right:var(--pad-r);left:auto;bottom:auto}
.player.is-full .step-hud.pos-bl{bottom:var(--safe-b);left:var(--pad-l);top:auto;right:auto}
.player.is-full .step-hud.pos-br{bottom:var(--safe-b);right:var(--pad-r);top:auto;left:auto}
.player.is-full.hud-hidden .step-hud.has-step{opacity:1}
.coach{display:grid;gap:7px;padding:10px var(--s4) 10px var(--s3);border-radius:var(--r-md);border-left:4px solid var(--sun);
  background:rgba(11,17,23,.86);box-shadow:0 6px 20px rgba(0,0,0,.45);color:#fff}
.coach.pop{animation:stepPop .5s ease-out}
.coach-dots{display:flex;gap:5px}
.coach-dots i{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);transition:background .3s}
.coach-dots i.on{background:var(--sun)}
.coach-line{display:grid;grid-template-columns:auto 1fr;gap:var(--s2);align-items:center;font-size:var(--fs-step);font-weight:850;line-height:1.25}
.coach .num{width:1.6em;height:1.6em;border-radius:8px;font-size:.85em;background:var(--sun);color:var(--dark)}
@keyframes stepPop{0%{opacity:0;transform:scale(.94)}60%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
@media(orientation:landscape) and (max-height:500px){.player.is-full .step-hud{width:min(44%,400px)}.coach{padding:7px var(--s3) 7px var(--s2);gap:5px}}
@media(orientation:portrait){.player.is-full .step-hud{width:auto;max-width:none}
  .player.is-full .step-hud.pos-tl,.player.is-full .step-hud.pos-bl{right:var(--pad-r)}}
/* Narration moves to the top edge when the coach card takes a bottom corner. */
.player.is-full.sub-top .subtitle{bottom:auto;top:var(--safe-t)}
@media(orientation:landscape){
  .player.is-full .hud-bottom{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"spots controls" "cards cards"}
  .player.is-full .spots{margin-right:0;padding-right:0}
}
@media(orientation:landscape) and (max-height:500px){
  .player.is-full .hud-top{padding-bottom:22px}
  .player.is-full .hud-title{font-size:1rem}
  .player.is-full .hud-desc{font-size:var(--fs-sm);margin-top:3px}
  .player.is-full .hud-bottom{padding-top:22px}
  .player.is-full .tile{min-height:50px}
}

/* ===== 6. Lesson panel ===== */
.panel{grid-area:info;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:0 8px 30px rgba(16,24,32,.05);padding:var(--s4)}
@media(min-width:900px){.panel{padding:22px}}
.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-weight:850;font-size:.7rem;color:#8a0000}
.panel h2{margin:4px 0 2px;font-size:var(--fs-xl);letter-spacing:-.03em}
.panel h3{font-size:.98rem;margin:var(--s4) 0 var(--s2)}
.tagline{font-weight:750;margin:0 0 var(--s2);color:#555f6b}
.desc{font-size:.95rem;line-height:1.5;margin:0;color:#37414b}
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:center;background:#f6f7f8;border:1px solid #edf0f2;border-radius:var(--r-sm);padding:var(--s2) var(--s3);line-height:1.4;font-size:var(--fs-md)}
.num{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--dark);color:#fff;font-weight:900}
.tip{margin-top:var(--s3);padding:11px;border:1px solid #eadfc6;background:#fcf8ef;border-radius:var(--r-sm);line-height:1.5;font-size:var(--fs-md)}
.tip strong{color:#6b5018}
.summary[hidden]{display:none}
.summary details{border:1px solid var(--border);border-radius:var(--r-sm);margin-top:var(--s2);background:#fafbfc;overflow:hidden}
.summary summary{min-height:var(--tap);padding:11px 14px;font-weight:850;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.summary summary::-webkit-details-marker{display:none}
.summary summary::after{content:"＋";font-weight:900;color:var(--muted)}
.summary details[open] summary::after{content:"－"}
.summary ul{margin:0;padding:0 var(--s4) var(--s3) 32px;line-height:1.5;font-size:var(--fs-md);color:#37414b}
.summary li{margin:3px 0}
.quiz{margin-top:var(--s4);padding:14px;border-radius:var(--r-md);background:var(--dark);color:#fff}
.quiz[hidden]{display:none}
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s2)}
.stars{font-weight:900;color:var(--sun)}
.quiz-q{font-size:1rem;line-height:1.45;margin:0 0 10px;font-weight:650}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.quiz-opts .btn{border-width:2px;font-size:.95rem;white-space:normal}
.quiz-opts .is-right{background:var(--go);border-color:var(--go)}
.quiz-opts .is-wrong{background:var(--stop);border-color:var(--stop)}
.quiz-why{margin:10px 0 0;font-size:var(--fs-md);line-height:1.45;color:#e8eaed;min-height:1.2em}
.quiz .btn--gold{margin-top:10px}
.quiz [hidden]{display:none}
.source{margin:var(--s3) 0 0;font-size:.75rem;color:var(--muted)}

/* ===== 7. Splash ===== */
.splash{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;overflow:auto;color:#fff;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  background:radial-gradient(ellipse at 50% 10%,#8d1018 0%,#40060b 45%,var(--dark) 100%)}
.splash[hidden]{display:none}
.splash-card{position:relative;width:min(100%,600px);text-align:center;padding:clamp(26px,5vw,46px) clamp(18px,5vw,46px);
  border:1px solid rgba(179,153,93,.5);border-radius:24px;background:linear-gradient(145deg,rgba(17,24,32,.95),rgba(27,32,40,.95));box-shadow:0 24px 90px rgba(0,0,0,.5);overflow:hidden}
.splash-card::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,var(--red) 0 48%,var(--gold) 48% 52%,var(--red) 52%)}
.splash-ball{font-size:3rem;margin:4px 0 6px}
.splash h1{font-size:clamp(2.5rem,9vw,4.4rem);letter-spacing:-.06em;line-height:.98;margin:0}
.splash h1 span{display:block;color:var(--gold)}
.splash-copy{max-width:420px;margin:var(--s4) auto 22px;color:#e2e5e8;font-size:1rem;line-height:1.55}
.splash .btn--gold{width:min(100%,320px);min-height:56px;font-size:1.1rem;font-weight:950;border-radius:var(--r-md);box-shadow:0 7px 0 var(--gold-dark)}
.splash .btn--gold:active{transform:translateY(4px);box-shadow:0 3px 0 var(--gold-dark)}
</style>
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body class="locked">

<div class="splash" id="splash" role="dialog" aria-modal="true" aria-labelledby="splashTitle">
  <div class="splash-card">
    <div class="splash-ball" aria-hidden="true">🏈</div>
    <h1 id="splashTitle">Ronan’s <span>Playbook</span></h1>
    <p class="splash-copy">Call a play, run a route, learn the rules. Then test yourself like a ref.</p>
    <button class="btn btn--gold" id="startBtn" type="button">Let’s Play <span aria-hidden="true">→</span></button>
  </div>
</div>

<header class="topbar">

    state.playing = true; state.last = 0;
    if (state.progress === 0) stopSpeech();
    fireBeats(); draw(); updateStepHud(); syncButtons();
    state.raf = requestAnimationFrame(tick);
    scheduleHide(TIMING.hudHideOnPlayMs);
  }
  function halt() { state.playing = false; state.last = 0; if (state.raf) cancelAnimationFrame(state.raf); state.raf = 0; }
  function pause() { if (!state.playing) return; halt(); stopSpeech(); syncButtons(); showHud(); }
  function rebuild() {
    halt(); state.progress = 0; state.fired = {};
    state.scene = lesson().build(); buildScene(); buildStepHud();
    setCaption(state.hudDefault); syncButtons();
  }
  function renderAll(autoplay) {
    stopSpeech();
    renderHud(); rebuild(); renderSpots(); renderCards(); renderInfo();
    if (autoplay) play(); else showHud();
  }
  function switchTab(t) {
    if (t === state.tab) return;
    state.tab = t;
    each(el.tabs, function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === t)); });
    renderAll(false);
  }

  /* =====================================================================
   * 15. FULL SCREEN (native where allowed, CSS fallback on iPhone)
   * ===================================================================== */
  function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  // Android / Fire tablets allow rotating to landscape inside native full screen; iPhone ignores this.
  function lockLandscape() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {} }
  function unlockOrientation() { try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
  // First-run tip (replaces the browser's exit box). Shown once per device.
  var fsHintTimer = 0;
  function hideFsHint(now) {
    clearTimeout(fsHintTimer);
    if (el.fsHint.hidden) return;
    if (now) { el.fsHint.hidden = true; return; }
    el.fsHint.classList.add("is-fading");
    fsHintTimer = setTimeout(function () { el.fsHint.hidden = true; }, 300);
  }
  function showFsHintOnce() {
    var seen = false;
    try { seen = localStorage.getItem("rp-fs-hint") === "1"; localStorage.setItem("rp-fs-hint", "1"); } catch (e) {}
    if (seen) return;
    el.fsHint.classList.remove("is-fading"); el.fsHint.hidden = false;
    fsHintTimer = setTimeout(hideFsHint, TIMING.fsHintMs);
  }
  el.fsHintX.addEventListener("click", function () { hideFsHint(); });

  function setFullUI(on) {
    el.player.classList.toggle("is-full", on);
    if (!on) hideFsHint(true);
    el.player.classList.remove("hud-hidden");
    document.body.classList.toggle("locked", on);
    iconLabel(el.fullBtn, on ? "✕" : "⛶", on ? "Exit full screen" : "Full");
    el.fullBtn.setAttribute("aria-pressed", String(on));
    applyOrientation();
    requestAnimationFrame(function () { centerSelected(el.cards); centerSelected(el.spots); placeCoachCard(); });
    scheduleHide(TIMING.hudHideMs);
  }
  function toggleFull() {
    if (isFull()) {
      if (fsElement()) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        unlockOrientation(); // exiting the player pops back to App mode when it was on
        try { var p = exit && exit.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {}
      }
      setFullUI(false); return;
    }
    setFullUI(true);
    // Native full screen hides the browser bars and allows auto-rotation; the browser then shows its
    // own exit message, so our first-run tip only appears where native isn't available (iPhone).
    var req = NATIVE_FULLSCREEN && (el.player.requestFullscreen || el.player.webkitRequestFullscreen);
    if (!req) { showFsHintOnce(); return; }
    try {
      var r = req.call(el.player);
      if (r && r.then) r.then(lockLandscape, showFsHintOnce);
      else setTimeout(function () { if (fsElement()) lockLandscape(); else showFsHintOnce(); }, 300);
    } catch (e) { showFsHintOnce(); }
  }
  // The player's native full screen sits on top of App mode; leaving it returns to App mode.
  function onFullChange() {
    if (fsElement() === el.player) { state.nativeFull = true; }
    else if (state.nativeFull) { state.nativeFull = false; unlockOrientation(); setFullUI(false); }
    syncAppModeBtn();
  }

  /* ===== App mode (whole page full screen) ===== */
  var root = document.documentElement;
  function appModeSupported() {
    var enabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    return APP_MODE && NATIVE_FULLSCREEN && !!enabled && coarse && !!(root.requestFullscreen || root.webkitRequestFullscreen);
  }
  function enterAppMode() { // must run inside a tap
    if (!appModeSupported() || fsElement()) return;
    try { var r = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (r && r.catch) r.catch(function () {}); } catch (e) {}
  }
  function syncAppModeBtn() { el.appModeBtn.hidden = !appModeSupported() || !!fsElement(); }
  el.appModeBtn.addEventListener("click", enterAppMode);
  document.addEventListener("fullscreenchange", onFullChange);
  document.addEventListener("webkitfullscreenchange", onFullChange);

  // HUD interaction: tap the field to show/hide during a play; using the HUD keeps it up.
  el.stage.addEventListener("pointerdown", function (e) {
    if (!isFull()) return;
    if (el.fsHint.contains(e.target)) return;
    var inHud = el.hudTop.contains(e.target) || el.hudBottom.contains(e.target);
    if (el.player.classList.contains("hud-hidden")) { showHud(); return; }
    if (inHud) { scheduleHide(TIMING.hudHideMs); return; }
    hideHud(); // tapping the field hides the controls, playing or paused (tap again to bring them back)
  });
  // Real mouse movement (desktop) brings the HUD back. Ignore touch-generated and synthetic moves
  // (browsers fire a fake move when the HUD fades under a still pointer), or a tap could never hide it.
  var lastMouse = null;
  el.player.addEventListener("pointermove", function (e) {
    if (!isFull() || e.pointerType !== "mouse") return;
    var moved = !lastMouse || Math.abs(e.clientX - lastMouse[0]) + Math.abs(e.clientY - lastMouse[1]) > 6;
    lastMouse = [e.clientX, e.clientY];
    if (!moved) return;
    if (el.player.classList.contains("hud-hidden")) showHud(); else scheduleHide(TIMING.hudHideMs);
  });
  ["touchmove", "wheel"].forEach(function (ev) { // swiping cards counts as using the HUD (programmatic scrolling doesn't)
    el.hudBottom.addEventListener(ev, function () { if (isFull()) scheduleHide(TIMING.hudHideMs); }, { passive: true });
  });
  document.addEventListener("keydown", function (e) {
    if (!isFull()) return;
    if (e.key === "Escape" && !fsElement()) { setFullUI(false); return; }
    showHud();
  });

  /* =====================================================================
   * 16. START
   * ===================================================================== */
  el.startBtn.addEventListener("click", function () {
    if (el.splash.hidden) return;
    enterAppMode(); // first, while we still have the tap
    el.splash.hidden = true;
    document.body.classList.remove("locked");
    speak("Let's play! Pick where the ball is, then call a play."); // first speech inside a tap unlocks voice on iOS
    requestAnimationFrame(function () { centerSelected(el.cards); centerSelected(el.spots); });
  });
  each(el.tabs, function (b) { b.addEventListener("click", function () { switchTab(b.dataset.tab); }); });
  el.playBtn.addEventListener("click", function () { if (state.playing) pause(); else play(); });
  el.resetBtn.addEventListener("click", function () { stopSpeech(); rebuild(); showHud(); });
  el.fullBtn.addEventListener("click", toggleFull);
  el.defenseBtn.addEventListener("click", function () {
    state.defense = !state.defense;
    el.defenseBtn.setAttribute("aria-pressed", String(state.defense));
    iconLabel(el.defenseBtn, "🛡", state.defense ? "Hide D" : "Defense");
    renderDefense();
    if (!state.playing) setCaption(state.defense
      ? (state.scene.field === "route" ? "Defense on: red circle is the defender, gold line is a coverage angle." : "Defense on: rushers start " + LEAGUE.rushYards + " yards back until a handoff.")
      : state.hudDefault);
  });
  el.voiceBtn.addEventListener("click", function () {
    state.voice = !state.voice;
    el.voiceBtn.setAttribute("aria-pressed", String(state.voice));
    iconLabel(el.voiceBtn, state.voice ? "🔊" : "🔇", state.voice ? "Voice" : "Muted");
    if (state.voice) speak("Voice is on."); else stopSpeech();
  });
  document.addEventListener("visibilitychange", function () { if (document.hidden) pause(); });

  syncAppModeBtn();
  iconLabel(el.resetBtn, "↺", "Reset");
  iconLabel(el.defenseBtn, "🛡", "Defense");
  iconLabel(el.voiceBtn, "🔊", "Voice");
  iconLabel(el.fullBtn, "⛶", "Full");
  renderAll(false);
})();
</script>
</body>
</html>
