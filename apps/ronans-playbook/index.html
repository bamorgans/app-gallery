,"No kickoffs. A coin toss picks who starts on offense. Teams switch sides at halftime.","Four 10-minute quarters on a running clock, a 1-minute water break between quarters, and a 3–5 minute halftime.","In your division a tie stays a tie. There’s no overtime.","One coach from each team may be on the field."]},{title:"📏 Drives & scoring",items:["Every drive starts at your own 5-yard line.","3 plays to cross midfield for a first down, then 3 plays to score.","Don’t make it? The other team starts at their own 5.","Touchdown = 6. Extra point: 1 from the 5, or 2 from the 12.","The offense has 30 seconds to snap. Each team gets 2 timeouts per half."]},{title:"🎯 Running & passing",items:["The QB can never run with the ball. No center sneaks.","Handoffs, pitches, and laterals are OK.","No-run zones (about 5 yards each side of midfield and 5 yards from each end zone): the ball must be thrown forward.","The QB has 7 seconds to throw or hand off.","One forward pass per play, thrown from behind the line. Underhand and shovel passes count.","Anyone can catch a pass, even the QB after a handoff. One foot in bounds is a catch.","The snap goes between the center’s legs. Only one player may be moving before the snap."]},{title:"🛡 Defense",items:["Rushers start 10 yards back. Any number can rush.","Players who aren’t rushing can stay at the line until the ball leaves the QB’s hands.","After a handoff, everyone can go.","Pull flags. No holding, pushing, or tackling. If the last defender tackles instead of pulling the flag, it’s an automatic touchdown."]},{title:"🛑 When the play is over",items:["The flag is pulled or falls off, the runner steps out of bounds, a knee touches the ground, or someone scores.","Flags must be on the sides of the hips.","No fumbles: a dropped ball is dead where it lands.","No diving forward. Spinning and jumping are OK. The ball is spotted at the runner’s feet.","Interceptions can be run back."]},{title:"🚩 Penalties",items:["Defense fouls give the offense an automatic first down: offsides (5 yards); pass interference, illegal contact, early flag pull, illegal rush, roughing the passer (10 yards).","Offense fouls cost a down: illegal motion or false start (5), illegal forward pass (5), offensive pass interference, flag guarding, or delay of game (10)."]},{title:"🙌 Playing time & sportsmanship",items:["Everyone plays at least 3 of 4 quarters. Subs happen between quarters.","No trash talk. Only the team captain asks the ref about a rule, and the ref’s call is final.","Coaches coach, players play, refs ref, fans cheer."]},{title:"🎽 Game-day gear",items:["Mouthguard in at all times.","Official FNL jersey, shorts, and flags. Flags must be a different color than your shorts, and never change your flags.","No metal spikes, hats, hoodies, jewelry, or sunglasses. Shorts can’t have pockets or stripes."]},{title:"📋 Coach notes",items:["Regular season: a team leading by 20+ gets 2 downs instead of 3. Leading by 30+, the trailing team gets 4 downs.","Field at least 5 players. No fill-in players.","Breaking the playing-time rule gives the other team 7 points each time.","To discuss a call, use a timeout or wait for a quarter break."]}]},{id:"drop",name:"Dropped Ball",tag:"No fumbles: the play is over.",emoji:"💥",desc:"If the ball hits the ground, the whistle blows. The defense can’t pick it up, and the ball is spotted where it landed.",steps:["The ball hits the ground? The play is over.","The ball is spotted where it landed.","The defense can’t take it. There are no fumbles."],tip:"Two hands on the ball when you run through a crowd.",quiz:Y,quizKey:"fumbles",build:function(){return V("drop")}},{id:"pitch",name:"Bad Pitch",tag:"Spotted where it lands.",emoji:"↩️",desc:"A pitch or lateral that hits the ground is dead right there. If it lands behind the line, you lose those yards.",steps:["The QB pitches the ball back.","It hits the ground: whistle.","The ball is spotted where it landed, even behind the line."],tip:"Short, soft pitches.
