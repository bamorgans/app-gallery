<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#127A70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fretwork">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Fretwork: chords, scales and theory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEEC; --surface:#F8FAF9; --ink:#17201D; --muted:#56635E; --line:#CCD6D2;
  --accent:#127A70; --accent-ink:#FFFFFF; --brass:#C98418; --brass-ink:#1E1404;
  --display:'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111615; --surface:#1A2220; --ink:#E6EEEB; --muted:#93A39D; --line:#2B3633;
    --accent:#45BCAE; --accent-ink:#06120F; --brass:#E8A63C; --brass-ink:#1E1404; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111615; --surface:#1A2220; --ink:#E6EEEB; --muted:#93A39D; --line:#2B3633;
  --accent:#45BCAE; --accent-ink:#06120F; --brass:#E8A63C; --brass-ink:#1E1404; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img,svg{max-width:100%}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font:700 22px/1 var(--display);letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
main{max-width:720px;margin:0 auto;padding:8px 16px 120px}
h2{font:700 30px/1.1 var(--display);letter-spacing:-.025em;margin:14px 0 4px}
h3{font:700 19px/1.2 var(--display);margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 12px;max-width:62ch}
p{margin:0 0 10px;max-width:65ch}
.muted{color:var(--muted)}
.small{font-size:14px}

.view{animation:enter .26s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.row-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 6px}
.row-scroll::-webkit-scrollbar{display:none}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;line-height:1.2;transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .tag{font-size:11px;opacity:.75;margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:38px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.on{background:var(--brass);color:var(--brass-ink)}
.btn:active{transform:scale(.97)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px}

/* Chord stage */
.stage-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chord-name{font:700 56px/1 var(--display);letter-spacing:-.04em;text-align:center;flex:1;min-width:0;overflow-wrap:anywhere}
.stage{display:flex;justify-content:center;padding:6px 0 0;touch-action:pan-y}
.stage.from-r{animation:fromR .28s ease}
.stage.from-l{animation:fromL .28s ease}
@keyframes fromR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.chord-svg{width:min(250px,72vw);height:auto;overflow:visible}
.chord-svg.sm{width:92px}
.cd-fret{stroke:var(--muted);stroke-width:1.2}
.cd-fret.nut{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.cd-str{stroke:var(--ink)}
.cd-dot circle{fill:var(--ink)}
.cd-dot text{fill:var(--surface);font:700 9px var(--body)}
.cd-dot.root circle{fill:var(--brass)}
.cd-dot.root text{fill:var(--brass-ink)}
.cd-barre{fill:var(--ink);opacity:.8}
.cd-open{fill:none;stroke:var(--ink);stroke-width:1.5}
.cd-open.root{stroke:var(--brass);stroke-width:2.6}
.cd-mark{fill:var(--muted);font:16px var(--body)}
.cd-base{fill:var(--muted);font:700 12px var(--body)}
.cd-note{fill:var(--muted);font:11px var(--body)}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.shake .cd-str{animation:vib .45s linear}
@keyframes vib{0%,100%{transform:translateX(0)}20%{transform:translateX(.9px)}40%{transform:translateX(-.9px)}60%{transform:translateX(.5px)}80%{transform:translateX(-.4px)}}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:10px auto 0;max-width:320px;font-size:15px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:700}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* Fretboard */
.fb-wrap{overflow-x:auto;margin:10px -16px 0;padding:0 16px 4px;scrollbar-width:thin}
.fb{display:block;height:auto;max-width:none}
.fb-num{fill:var(--muted);font:12px var(--body)}
.pos .hit{fill:transparent;cursor:pointer}
.pos .note{fill:var(--accent);opacity:0;transition:opacity .2s;transform-box:fill-box;transform-origin:center}
.pos text{fill:var(--accent-ink);font:700 10px var(--body);opacity:0;pointer-events:none;transition:opacity .2s}
.pos.on .note,.pos.tap .note{opacity:1}
.pos.on text,.pos.tap text{opacity:1}
.pos.root .note{fill:var(--brass)}
.pos.root text{fill:var(--brass-ink)}
.pos.tap:not(.on) .note{fill:#F3EEE2}
.pos.tap:not(.on) text{fill:#2A1A10}
.pos.ping .note{animation:ping .55s ease-out}
@keyframes ping{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.info{min-height:48px;padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:10px;font-size:15px}

/* Steps & tables */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.step{min-width:38px;text-align:center;padding:4px 8px;border-radius:8px;background:var(--bg);font-weight:700;font-size:14px}
.step.h{background:color-mix(in srgb,var(--brass) 30%,var(--bg))}
.list{display:grid;gap:6px;margin-top:8px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.li .grow{flex:1;min-width:0}
.li b{font-weight:700}
.li .play{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:14px;flex:none}

/* Rhythm */
.beats{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:12px 0}
.beat{border-radius:12px;background:var(--bg);text-align:center;padding:8px 0 6px;transition:background .1s}
.beat .arr{font:700 30px/1.1 var(--display);display:block}
.beat .cnt{font-size:12px;color:var(--muted)}
.beat .cnt.main{font-weight:700;color:var(--ink)}
.beat.rest .arr{color:var(--muted)}
.beat.playing{background:var(--accent);color:var(--accent-ink)}
.beat.playing .cnt{color:var(--accent-ink)}
.beat.playing .arr{animation:stroke .2s ease-out}
@keyframes stroke{from{transform:translateY(-6px) scale(1.2)}to{transform:none}}
.ctrl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--accent)}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px}

/* Progressions */
.strip{display:flex;gap:10px;overflow-x:auto;margin:10px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
.pcard{flex:none;width:112px;padding:8px 6px;border-radius:16px;border:1px solid var(--line);text-align:center;background:var(--surface);transition:transform .15s,border-color .15s}
.pcard .nm{font:700 20px/1 var(--display)}
.pcard .rn{font-size:12px;color:var(--muted)}
.pcard.playing{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);transform:translateY(-4px)}
.prog-item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:8px}
.prog-item.on{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.prog-item .t{font-weight:700}
.prog-item .n{font:700 15px var(--display);color:var(--accent)}

/* Strings */
.strings{display:grid;gap:4px}
.gstr{display:grid;grid-template-columns:34px 1fr 96px;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 6px;border-radius:14px;text-align:left;transition:background .15s}
.gstr.sel{background:var(--bg)}
.gnum{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);font:700 14px var(--display)}
.gstr.sel .gnum{background:var(--brass);color:var(--brass-ink)}
.gline svg{width:100%;height:26px;overflow:visible;display:block}
.gpath{fill:none;stroke:#9DA6A9;stroke-linecap:round}
.gstr.wound .gpath{stroke:#B98A45}
.gname{font:700 28px/1 var(--display)}
.gname small{display:block;font:12px/1.3 var(--body);color:var(--muted);margin-top:4px}
.mnemonic{font:700 22px/1.25 var(--display);letter-spacing:-.01em;margin:4px 0 8px}
.mnemonic span{color:var(--accent)}
.btn.danger{background:#B3261E;color:#fff}

/* Songs */
.songs-row{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.songs-row::-webkit-scrollbar{display:none}
.song-card{flex:none;width:168px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;transition:border-color .15s}
.song-card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.song-card .t{font:700 16px/1.2 var(--display)}
.song-card .a{font-size:13px;color:var(--muted)}
.song-card .lv{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.meta span{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--bg)}
.now-line{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.now-line b{font:700 34px/1 var(--display)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 6px}
.sec-h b{font:700 16px var(--display)}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar-cell{border:1px solid var(--line);border-radius:12px;padding:12px 2px;text-align:center;font:700 18px/1.1 var(--display);background:var(--surface);min-height:50px;transition:background .12s,color .12s}
.bar-cell small{display:block;font:11px var(--body);color:var(--muted);margin-top:2px}
.bar-cell.now{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar-cell.now small{color:var(--accent-ink)}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-height:44px;font-weight:700}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.btntv{background:var(--brass);color:var(--brass-ink)}
details.help summary{cursor:pointer;font:700 17px var(--display);list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help summary::after{content:" +";color:var(--accent)}
details.help[open] summary::after{content:" −"}
ol.howto{padding-left:22px;margin:10px 0}
ol.howto li{margin:6px 0}
.mini .beat .arr{font-size:22px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font:15px/1.5 var(--body);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two input,.two select{width:100%}
input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}

/* Tab links + backup */
.tab-form{display:flex;gap:8px;margin:10px 0}
.tab-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;color:var(--ink)}
.tab-form.add{flex-wrap:wrap;margin-top:14px}
.tab-form.add input{flex:1 1 220px}
a.chip{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.li a{color:var(--accent);text-decoration:none}
.li a:hover{text-decoration:underline}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.info:empty{display:none}

/* TV mode: fills the whole screen inside the device safe area */
.tv{position:fixed;inset:0;z-index:40;display:grid;grid-template-rows:auto 4px minmax(0,1fr) auto auto;gap:clamp(6px,1.4vh,18px);
  --sa-t:max(env(safe-area-inset-top),8px);--sa-r:max(env(safe-area-inset-right),10px);--sa-b:max(env(safe-area-inset-bottom),8px);--sa-l:max(env(safe-area-inset-left),10px);
  padding:var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l);
  --ink:#F1F5F3;--surface:#0E1513;--bg:#16201D;--muted:#8FA39C;--line:#2A3734;--accent:#45BCAE;--accent-ink:#06120F;--brass:#E8A63C;--brass-ink:#1E1404;
  background:radial-gradient(120% 90% at 30% 20%,#14211D 0%,#0E1513 60%);color:var(--ink);animation:fade .25s;overflow:hidden}
.tv-top{display:flex;justify-content:space-between;align-items:baseline;gap:2vw;min-width:0}
.tv-title{font:700 min(5vh,3.6vw)/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tv-title span{font:400 min(3.4vh,2.6vw) var(--body);color:var(--muted);margin-left:1vw}
.tv-sec{font:700 min(4vh,3vw) var(--display);color:var(--brass);white-space:nowrap}
.tv-prog{background:var(--bg);border-radius:3px;overflow:hidden}
.tv-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tv-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.42fr);gap:2vw;min-height:0;container-type:size;overflow:hidden}
.tv-now{display:flex;align-items:center;gap:3cqw;min-width:0;height:100%}
.tv-now>div:first-child{flex:none}
.tv-label{font:700 min(5cqh,2.2vw) var(--body);color:var(--muted);letter-spacing:.02em}
.tv-chord{font:700 min(66cqh,25cqw)/.86 var(--display);letter-spacing:-.04em;white-space:nowrap}
.tv-capo{font:700 min(5.5cqh,2.2vw) var(--body);color:var(--brass);margin-top:1cqh}
.tv .chord-svg,.tv .chord-svg.sm{width:auto;max-width:100%}
.tv-diag{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.tv-diag svg{height:100cqh}
.tv-next{border-left:2px solid var(--line);padding-left:2vw;border-radius:4px;transition:border-color .2s;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0;height:100%}
.tv-nchord{font:700 min(24cqh,11cqw)/1 var(--display);margin:.4cqh 0 1cqh;white-space:nowrap}
.tv-ndiag{min-height:0;display:flex;align-items:center;justify-content:flex-start}
.tv-ndiag svg{height:100%}
.tv-next.soon{border-left-color:var(--brass)}
.tv-next.soon .tv-nchord{color:var(--brass);animation:soon .45s ease-in-out infinite alternate}
@keyframes soon{to{transform:scale(1.06)}}
.tv-chord.flip,.tv-diag.flip{animation:flip .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes flip{from{opacity:.2;transform:translateY(2vh) scale(.94)}}
.tv-strum{display:grid;gap:.8vw;margin:0}
.tv-strum .beat{background:var(--bg);border-radius:1.4vh;padding:.8vh 0}
.tv-strum .beat .arr{font-size:min(7vh,5vw)}
.tv-strum .beat .cnt{font-size:min(2.6vh,2vw)}
.tv-strum .beat.hit{background:var(--accent);color:var(--accent-ink)}
.tv-strum .beat.hit .cnt{color:var(--accent-ink)}
.tv-strip{display:flex;gap:.8vw;overflow:hidden}
.tv-strip span{flex:none;min-width:8vw;text-align:center;padding:.8vh 1vw;border-radius:1.2vh;background:var(--bg);font:700 min(4.2vh,3.2vw) var(--display);color:var(--muted)}
.tv-strip span.cur{background:var(--ink);color:var(--surface)}
.tv-strip span.sec{box-shadow:inset 3px 0 0 var(--brass)}
/* Controls float over the picture and fade out while playing, so the content keeps the full screen */
.tv-ctrls{position:absolute;left:50%;bottom:var(--sa-b);transform:translateX(-50%);width:max-content;max-width:calc(100% - var(--sa-l) - var(--sa-r));display:flex;gap:min(1vw,10px);justify-content:center;flex-wrap:wrap;padding:10px;border-radius:18px;background:rgba(10,16,14,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);transition:opacity .4s;z-index:3}
.tv-ctrls button{min-height:44px;height:min(7.5vh,11vw);min-width:44px;padding:0 1.6vw;border-radius:1.6vh;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 min(3vh,4vw) var(--body);white-space:nowrap}
.tv-ctrls button.big{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:14vw}
.tv-ctrls button.big.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.tv-ctrls button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tv-ctrls .spd{display:inline-flex;align-items:center;gap:.6vw;font:700 min(3vh,4vw) var(--body)}
.tv.idle .tv-ctrls{opacity:0;pointer-events:none}
.tv.idle{cursor:none}
.tv-count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 min(60vh,40vw)/1 var(--display);color:var(--brass);text-shadow:0 1vh 6vh rgba(0,0,0,.6);z-index:2}
.tv-count:empty{display:none}
.tv-count b{animation:flip .35s}
.tv-rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  .tv{grid-template-rows:auto 4px minmax(0,1fr) auto}
  .tv-strip{display:none}
  .tv-ctrls{flex-wrap:nowrap;gap:6px;padding:6px}
  .tv-ctrls button{height:40px;min-height:40px;padding:0 10px;font-size:14px;border-radius:10px}
  .tv-ctrls button.big{min-width:96px}
  .tv-ctrls .spd{font-size:14px;gap:4px}
}

  nn.classList.toggle('soon',!!(slot>=0&&nx.name&&nx.name!==name&&nx.left<=(spb===6?3:2)));

}

/* Custom song charts: "Verse x2: G Em C D" one section per line; "C,G" splits a bar; "G!" is one strum and let ring */
function parseChart(text){const lines=String(text||'').split(/\n/).map(l=>l.trim()).filter(Boolean);const sections=[];let bad=null;
  lines.forEach((l,i)=>{let name=`Part ${i+1}`,rep=1,body=l;const m=/^([^:]+):(.*)$/.exec(l);
    if(m){body=m[2];let h=m[1].trim();const r=/\s*[x×]\s*(\d+)\s*$/i.exec(h);if(r){rep=Math.min(16,Math.max(1,+r[1]));h=h.slice(0,r.index).trim();}name=h||name;}
    const toks=body.trim().split(/\s+/).filter(Boolean);
    toks.forEach(tk=>tk.replace(/!$/,'').split(',').forEach(c=>{if(!bad&&!songChord(null,c))bad=c;}));
    if(toks.length)sections.push({name:name.slice(0,24),rep,bars:toks.join(' ')});});
  return{sections,bad,bars:sections.reduce((a,s)=>a+s.bars.split(' ').length*s.rep,0)};}
function chartPreview(text){if(!String(text).trim())return'One section per line, like <b>Verse x2: G Em C D</b>.';const r=parseChart(text);if(r.bad)return`Can't read the chord <b>${esc(r.bad)}</b>. Start each chord with A to G, like Em, F#m or Cadd9.`;return`${r.sections.length} section${r.sections.length===1?'':'s'}, ${r.bars} bars in all.`;}

function beatsHTML(p,id,cls=''){const n=p.length,counts=n===6?['1','2','3','4','5','6']:['1','&','2','&','3','&','4','&','e','a','e','a'].slice(0,n);const main=i=>n===6?i%3===0:i%2===0;
  return `<div class="beats${cls?' '+cls:''}"${id?` id="${id}"`:''} style="grid-template-columns:repeat(${n},1fr)">${[...p].map((ch,i)=>`<div class="beat${ch==='-'?' rest':''}" data-i="${i}"><span class="arr">${slotGlyph(ch)}</span><span class="cnt${main(i)?' main':''}">${counts[i]||''}</span></div>`).join('')}</div>`;}
function slotGlyph(ch){return ch==='D'?'↓':ch==='U'?'↑':ch==='B'?'B':ch==='b'?'b':ch==='P'?'♪':'·';}

/* ---------- Tab links: Songsterr search + saved links, kept in the library ---------- */
const slugify=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const songsterrUrl=(id,artist,title)=>`https://www.songsterr.com/a/wsa/${slugify(artist)}-${slugify(title)}-tab-s${id}`;
const safeUrl=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null;}catch(e){return null;}};
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';}};
const tabQueryDefault=()=>{const s=curSong();return `${s.name} ${s.artist||''}`.trim();};
async function tabSearch(q){
  q=(q||'').trim();if(!q)return;S.tabSearch={q,state:'loading',results:[]};paintTabResults();
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
  try{const r=await fetch(`https://www.songsterr.com/api/songs?pattern=${encodeURIComponent(q)}&size=12`,{signal:ctl.signal});
    if(!r.ok)throw new Error('http '+r.status);const data=await r.json();const arr=Array.isArray(data)?data:(data.songs||data.results||[]);
    const results=arr.map(x=>{const id=x.songId??x.id;const artist=typeof x.artist==='string'?x.artist:(x.artist&&x.artist.name)||x.artistName||'';const title=x.title||x.name||'';
      return id&&title?{title,artist,url:songsterrUrl(id,artist,title),tracks:Array.isArray(x.tracks)?x.tracks.length:null,chords:!!x.hasChords}:null;}).filter(Boolean).slice(0,12);
    S.tabSearch={q,state:'ok',results};
  }catch(e){S.tabSearch={q,state:'blocked',results:[]};}
  finally{clearTimeout(to);}
  paintTabResults();
}
function tabResultsHTML(){
  const ts=S.tabSearch,q=ts?ts.q:tabQueryDefault();
  const outs=`<p class="small muted" style="margin-top:8px">Also search: <a href="https://www.songsterr.com/?pattern=${encodeURIComponent(q)}" target="_blank" rel="noopener">Songsterr ↗</a> · <a href="https://www.ultimate-guitar.com/search.php?search_type=title&value=${encodeURIComponent(q)}" target="_blank" rel="noopener">Ultimate Guitar ↗</a>. Copy a tab's link, then paste it below to save it.</p>`;
  if(!ts)return outs;

  if(!ts.results.length)return `<div class="info">No Songsterr tabs found for “${esc(q)}”. Try just the song title.</div>${outs}`;

    <div class="btns"><button class="btn ghost" data-act="ad-hear">▶ Hear one bar on G</button></div>`;}
  if(a.type==='prog'){form=`<div class="field"><label for="adName">Progression name</label><input id="adName" type="text" maxlength="28" value="${esc(a.name)}" data-act="ad-field" data-v="name"></div>

function progPreview(nums){if(!nums.trim())return'Add numerals to preview the chords in C, G and D.';const ks=[0,7,2].map(k=>{const r=resolveProg(nums,k);return r?`<b>${nname(k)}:</b> ${r.map(c=>chordLabel(c,k)).join('  ')}`:null;});return ks[0]?ks.join('<br>'):'Use I to vii with an optional 7 or °, separated by spaces.';}

/* ---------- Render ---------- */
function clampAll(){S.scale.idx=Math.min(S.scale.idx,allScales().length-1);S.rhythm.idx=Math.min(S.rhythm.idx,allStrums().length-1);S.prog.idx=Math.min(S.prog.idx,allProgs().length-1);if(!chordCats().includes(S.chordCat))S.chordCat='Major';}
function render(){
  const m=$('#main');const v={strings:viewStrings,songs:viewSongs,chords:viewChords,scales:viewScales,theory:viewTheory,rhythm:viewRhythm,progs:viewProgs}[S.tab];
  m.innerHTML=`<section class="view" aria-label="${S.tab}">${v()}</section>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===S.tab));
  if(S.tab==='chords')attachSwipe();
  if(S.tab==='scales'){paintScale();const w=$('#scaleWrap');const rf=((S.scale.root-4)+12)%12;w.scrollLeft=Math.max(0,fbX(rf)-60);}
  if(S.tab==='theory')paintTheory();
  if(S.tab==='songs'){spdLabel();paintPos();}
  syncPlay();
}
function rerenderChord(dir){render();const st=$('#stage');if(st&&dir){st.classList.add(dir>0?'from-r':'from-l');}}
function strumNow(){const c=currentChord();if(!c)return;playChord(c.frets,0,'down',.5,.022);const st=$('#stage svg');if(st){st.classList.remove('shake');void st.getBBox();st.classList.add('shake');}}

 'th-dia':i=>{i=+i;const r=S.theory.root,flat=FLAT_KEYS.includes(r),[n,q]=DIATONIC[i],pc=(r+MAJOR[i])%12;playChord(voicing(pc,q),0,'down',.5,.022);
   S.theory.focus={root:pc,ivs:QIV[q],title:`${n} = ${nname(pc,flat)}${q} chord tones`};render();},
 'goto-barre':()=>{S.tab='chords';S.chordCat='Barre';render();window.scrollTo({top:0});},
 'goto-progs':()=>{S.tab='progs';S.prog.key=S.theory.root;render();window.scrollTo({top:0});},
 'rh-pick':v=>{const was=seq&&seq.kind==='rhythm';stopSeq();S.rhythm.idx=+v;render();if(was)A['rh-play']();},
 'rh-bpm':(v,el)=>{S.rhythm.bpm=+el.value;$('#rhBpmV').textContent=S.rhythm.bpm+' bpm';},
 'rh-chord':(v,el)=>{S.rhythm.chord=el.value;},
 'rh-play':()=>{if(seq&&seq.kind==='rhythm')return stopSeq();const pat=allStrums()[S.rhythm.idx].p;
   startSeq('rhythm',()=>60/S.rhythm.bpm/2,(i,t)=>{const slot=i%pat.length,ch=pat[slot],c=findChord(S.rhythm.chord)||DEFAULT_CHORDS[4];
     if(ch!=='-')playSlot(c.frets,ch,t,slot===0?.55:null);
     atTime(t,()=>{document.querySelectorAll('#beats .beat').forEach((b,k)=>b.classList.toggle('playing',k===slot));});});},
 'pr-key':v=>{const was=seq&&seq.kind==='prog';stopSeq();S.prog.key=+v;render();if(was)A['pr-play']();},
 'pr-pick':v=>{stopSeq();S.prog.idx=+v;render();const p=$('.panel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'});},
 'pr-strum':(v,el)=>{S.prog.strum=+el.value;},
 'pr-bpm':(v,el)=>{S.prog.bpm=+el.value;$('#prBpmV').textContent=S.prog.bpm+' bpm';},
 'pr-play':()=>{if(seq&&seq.kind==='prog')return stopSeq();const pr=allProgs()[S.prog.idx],chords=resolveProg(pr.nums,S.prog.key);if(!chords)return;
   const vs=chords.map(c=>voicing(c.pc,c.q));
   startSeq('prog',()=>60/S.prog.bpm/2,(i,t)=>{const pat=allStrums()[S.prog.strum].p,slot=i%pat.length,bar=Math.floor(i/pat.length)%vs.length,ch=pat[slot];
     if(ch!=='-')playSlot(vs[bar],ch,t,slot===0?.55:null);
     if(slot===0)atTime(t,()=>{document.querySelectorAll('#strip .pcard').forEach((p,k)=>{p.classList.toggle('playing',k===bar);if(k===bar)p.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});});});});},
 'add-open':()=>openAdd(S.tab==='scales'?'scale':S.tab==='rhythm'?'strum':S.tab==='progs'?'prog':S.tab==='songs'?'song':'chord'),
 'ad-close':()=>{S.add=null;renderSheet();},
 'ad-type':v=>{S.add.type=v;S.add.err='';renderSheet();},
 'ad-field':(v,el)=>{S.add[v]=el.value;if(v==='name'&&S.add.type==='chord')$('#adPrev').innerHTML=chordSVG(S.add.frets,{name:S.add.name,labels:'interval',anim:false});if(v==='nums')$('#adProgPrev').innerHTML=progPreview(el.value);if(v==='chart')$('#adSongPrev').innerHTML=chartPreview(el.value);},
 'ad-fret':(v,el)=>{S.add.frets[+v]=+el.value;$('#adPrev').innerHTML=chordSVG(S.add.frets,{name:S.add.name,labels:'interval',anim:true});playChord(S.add.frets,0,'down',.45,.02);},
 'ad-hear':()=>{const a=S.add;const c=ac(),t=c.currentTime+.03;
   if(a.type==='chord')playChord(a.frets,0,'down',.5,.022);
   if(a.type==='scale')[...a.iv,12].forEach((iv,k)=>playNote(48+iv,t+k*.28,.5,.5));
   if(a.type==='strum'){const g=DEFAULT_CHORDS[4].frets,d=60/84/2;[...a.p].forEach((ch,k)=>{if(ch!=='-')playChord(g,t+k*d,ch==='D'?'down':'up',k===0?.55:.42,.012);});}},
 'ad-iv':v=>{v=+v;const a=S.add;a.iv=a.iv.includes(v)?a.iv.filter(x=>x!==v):[...a.iv,v].sort((x,y)=>x-y);playNote(48+v,0,.5,.6);renderSheet();},
 'ad-cell':v=>{const a=S.add,i=+v,nx={'D':'U','U':'-','-':'D'};a.p=a.p.slice(0,i)+nx[a.p[i]]+a.p.slice(i+1);renderSheet();},
 'ad-num':v=>{const a=S.add;if(v==='⌫'){a.nums=a.nums.trim().split(/\s+/).slice(0,-1).join(' ');}else a.nums=(a.nums.trim()+' '+v).trim();renderSheet();},
 'ad-remove':v=>{const [k,i]=v.split(':');lib[k].splice(+i,1);save();clampAll();renderSheet();render();toast('Removed');},
 'ad-save':()=>{const a=S.add,name=(a.name||'').trim();const fail=m=>{a.err=m;$('#adErr').textContent=m;};
   if(!name)return fail('Give it a name first.');
   if(a.type==='chord'){if(a.frets.every(f=>f<0))return fail('Set at least one string to a fret or open.');const cat=(a.cat||'').trim()||'Yours';if(cat==='Barre')return fail('Barre is reserved for the builder. Choose another group.');
     lib.chords.push({name,cat,frets:[...a.frets]});save();S.add=null;renderSheet();S.tab='chords';S.chordCat=cat;S.chordIdx=chordsIn(cat).length-1;render();strumNow();toast('Chord saved');}
   if(a.type==='scale'){if(a.iv.length<3)return fail('Pick at least two notes besides the root.');lib.scales.push({name,iv:[...a.iv]});save();S.add=null;renderSheet();S.tab='scales';S.scale.idx=allScales().length-1;render();toast('Scale saved');}
   if(a.type==='strum'){if(!/[DU]/.test(a.p))return fail('Add at least one down or up strum.');lib.strums.push({name,p:a.p});save();S.add=null;renderSheet();S.tab='rhythm';S.rhythm.idx=allStrums().length-1;render();toast('Pattern saved');}
   if(a.type==='prog'){const toks=a.nums.trim().split(/\s+/).filter(Boolean);if(toks.length<2||!resolveProg(a.nums,0))return fail('Use at least two numerals like I, IV, V or vi, separated by spaces.');lib.progs.push({name,nums:toks.join(' ')});save();S.add=null;renderSheet();S.tab='progs';S.prog.idx=allProgs().length-1;render();toast('Progression saved');}
   if(a.type==='song'){const r=parseChart(a.chart);if(!r.sections.length)return fail('Add at least one line of chords.');if(r.bad)return fail(`Can't read the chord ${r.bad}. Start each chord with A to G.`);const bpm=Math.max(40,Math.min(220,Math.round(+a.bpm)||90));const st=allStrums()[+a.strum]||allStrums()[1];
     lib.songs.push({name,artist:(a.artist||'').trim().slice(0,40),bpm,ts:a.ts==='6/8'?'6/8':'4/4',capo:Math.max(0,Math.min(7,+a.capo||0)),p:st.p,sections:r.sections});save();S.add=null;renderSheet();stopSeq();S.tab='songs';Object.assign(S.song,{idx:songList().length-1,pos:0,loop:-1,strum:null});render();window.scrollTo({top:0});toast('Song saved');}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT'||t.tagName==='INPUT')return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset.v,t,e);}});
document.addEventListener('input',e=>{const t=e.target.closest('[data-act]');if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')&&t.type!=='file')A[t.dataset.act]&&A[t.dataset.act](t.dataset.v,t,e);});
document.addEventListener('change',e=>{const t=e.target.closest('[data-act]');if(t&&(t.tagName==='SELECT'||(t.tagName==='INPUT'&&t.type==='file')))A[t.dataset.act]&&A[t.dataset.act](t.dataset.v,t,e);});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='tab-search'){const q=$('#tabQ');if(q){q.blur();tabSearch(q.value);}}
  if(f.dataset.form==='tab-add'){const u=safeUrl(($('#tabUrl').value||'').trim());if(!u){toast('Paste a full link that starts with https://');return;}
    if(lib.tabs.some(t=>t.url===u)){toast('That link is already saved');return;}
    const name=($('#tabName').value||'').trim()||`${curSong().name} (${hostOf(u)})`;lib.tabs.push({name:name.slice(0,80),artist:'',url:u,source:hostOf(u),song:curSong().name,added:Date.now()});save();render();toast('Link saved');}});
document.addEventListener('keydown',e=>{if(S.tv){const k=e.key,onBtn=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(k==='Escape'){e.preventDefault();if($('#tvHelp'))$('#tvHelp').remove();else closeTV();}
  else if((k===' '||k==='k')&&!(onBtn&&k===' ')){e.preventDefault();A['song-play']();}
  else if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();A['tv-step'](k==='ArrowRight'?1:-1);}
  else if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();A['tv-spd'](k==='ArrowUp'?1:-1);}
  return;}
 if(e.key==='Escape'){if(S.add)A['ad-close']();if(S.confirm)A['reset-cancel']();if(S.backup)A['backup-close']();}if(S.tab==='chords'&&!S.add&&!/INPUT|SELECT/.test(document.activeElement.tagName)){if(e.key==='ArrowRight')A['step-chord'](1);if(e.key==='ArrowLeft')A['step-chord'](-1);}});
/* Fretboard taps */
document.addEventListener('click',e=>{const g=e.target.closest&&e.target.closest('.pos');if(!g)return;const svg=g.closest('svg');const s=+g.dataset.s,f=+g.dataset.f,m=OPEN[s]+f,pc=pcOf(m);
  playString(s,m,0,.55);
  if(svg.id==='fbTheory'){const r=S.theory.root,flat=FLAT_KEYS.includes(r),iv=(pc-r+12)%12;
    ping(svg,s,f,nname(pc,flat));$('#tapInfo').innerHTML=`${STR_LONG[s]}, ${f===0?'open':ord(f)+' fret'}: <b>${nname(pc,flat)}${Math.floor(m/12)-1}</b>. From ${nname(r,flat)} that is a <b>${INAMES[iv]}</b> (${iv} half step${iv===1?'':'s'}).`;}
  else ping(svg,s,f,NOTES[pc]);});

let toastT;function toast(msg){const h=$('#toastHost');h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>h.innerHTML='',2200);}

render();
initStore().then(()=>{clampAll();render();});
</script>
</body>
</html>
