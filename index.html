<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Gallery</title>
<meta name="description" content="A launcher for my single-page apps.">
<!-- Without its own icons, iOS falls back to bamorgans.github.io/apple-touch-icon.png,
     the account site's icon, for the home-screen shortcut. -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Apps">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --text: #1c1c1a;
    --muted: #6b6a66;
    --border: #e3e1dc;
    --focus: #2b6cb0;
    --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 14px rgb(0 0 0 / .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121312;
      --surface: #1c1d1c;
      --text: #ecebe7;
      --muted: #9b9a95;
      --border: #2d2e2c;
      --focus: #7fb0ff;
      --shadow: 0 1px 2px rgb(0 0 0 / .4);
    }
  }
  * { box-sizing: border-box; }
  /* The filters hide cards with the hidden attribute; .card's display: flex
     would otherwise override it and leave every card showing. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 48px 16px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  input[type=search] {
    width: min(280px, 100%);
    padding: 9px 12px;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input[type=search]:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; width: min(400px, 100%); }
  .tools input[type=search] { flex: 1; min-width: 160px; min-height: 44px; }
  .refresh {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    touch-action: manipulation;
  }
  .refresh:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .refresh svg { width: 16px; height: 16px; }
  .refresh[aria-busy="true"] svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh[aria-busy="true"] svg { animation: none; } }
  .status { flex-basis: 100%; margin: 0; text-align: right; font-size: 12px; color: var(--muted); min-height: 1.5em; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: -8px 0 20px; }
  .chip, .filters select {
    min-height: 36px; padding: 6px 14px;
    font: inherit; font-size: 14px;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .chip:focus-visible, .filters select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .chip .n { margin-left: 4px; opacity: .65; font-variant-numeric: tabular-nums; }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); list-style: none; margin: 0; padding: 0; }
  .card {
    position: relative;
    display: flex; flex-direction: column; gap: 12px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent, var(--border));
    border-radius: 12px;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .icon-wrap { position: relative; flex: none; }
  .badge {
    position: absolute; top: -7px; right: -9px;
    padding: 1px 6px;
    font-size: 11px; font-weight: 700; line-height: 16px; letter-spacing: .02em;
    color: #fff; background: #d6336c;
    border: 2px solid var(--surface); border-radius: 999px;
  }
  .icon {
    flex: none; width: 48px; height: 48px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--accent, #555); color: #fff; font-weight: 700; font-size: 20px;
    object-fit: cover;
  }
  .card h2 { margin: 0; font-size: 18px; }
  /* The title link covers the whole card so any click launches the app;
     the source link sits above it via z-index. */
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a::after { content: ""; position: absolute; inset: 0; border-radius: 12px; }
  .card h2 a:focus { outline: none; }
  .lock { margin-left: auto; font-size: 14px; }
  .desc { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
  .meta { margin: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .links { position: relative; z-index: 1; display: flex; gap: 12px; flex: none; }
  .links a { font-size: 13px; color: var(--muted); }
  .links a:hover, .links button:hover { color: var(--text); }
  .links button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }

  dialog {
    width: min(400px, calc(100% - 32px));
    padding: 20px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog .head h2 { margin: 0; font-size: 18px; }
  dialog ol { margin: 16px 0; padding-left: 22px; }
  dialog li { margin: 6px 0; }
  dialog p { margin: 12px 0; font-size: 14px; color: var(--muted); }
  .share { display: inline-block; width: 15px; height: 18px; vertical-align: -3px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .btn {
    min-height: 44px; padding: 10px 16px;
    font: inherit; font-weight: 600; text-decoration: none; text-align: center;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
  }
  .btn.primary { background: var(--focus); border-color: var(--focus); color: #fff; }
  .empty { color: var(--muted); padding: 32px 0; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>App Gallery</h1>
      <p>Single-page apps, all in one place.</p>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Filter apps…" aria-label="Filter apps">
      <button class="refresh" id="refresh" type="button" title="Check for new and updated apps">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
        Refresh</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </header>
  <div class="filters" role="toolbar" aria-label="Show">
    <button class="chip" type="button" data-show="all" aria-pressed="true">All</button>
    <button class="chip" type="button" data-show="new" title="New apps and apps updated in the last two weeks">New</button>
    <button class="chip" type="button" data-show="updated" title="Apps updated in the last two weeks">Updates</button>
    <button class="chip" type="button" data-show="public" title="Apps that need no password">Public</button>
    <select id="category" aria-label="Category"><option value="">All categories</option></select>
  </div>
  <ul class="grid" id="grid"></ul>
  <p class="empty" id="empty" hidden>No apps match.</p>
  <footer><a href="admin/">Admin</a></footer>
</div>

<dialog id="install" aria-labelledby="install-title">
  <div class="head"><img class="icon" id="install-icon" alt=""><h2 id="install-title"></h2></div>
  <div id="install-body"></div>
  <div class="actions">
    <button class="btn" id="install-close" type="button">Close</button>
    <a class="btn primary" id="install-go"></a>
  </div>
</dialog>

<script src="apps.js"></script>
<script>
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const q = document.getElementById("q");
  const refreshBtn = document.getElementById("refresh");
  const statusEl = document.getElementById("status");

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  // gallery.json records when the publish workflow first added an app and
  // when it last published a new version. Either within NEW_DAYS earns the
  // New badge; the Updates filter shows only the second kind.
  const NEW_DAYS = 14;
  const DAY = 864e5;
  const recent = (iso) => {
    if (!iso) return false;
    const [y, m, d] = iso.split("-").map(Number);
    return Date.now() - new Date(y, m - 1, d) < NEW_DAYS * DAY;
  };
  // With the year once it isn't this year's.
  const longDate = (iso) => new Date(iso + "T12:00").toLocaleDateString(undefined,
    { day: "numeric", month: "short", ...(iso.slice(0, 4) === String(new Date().getFullYear()) ? {} : { year: "numeric" }) });
  const shortDate = (iso) => new Date(iso + "T12:00").toLocaleDateString(undefined, { day: "numeric", month: "short" });

  // The catalogue as the page holds it: sorted, with the New/Updates flags
  // worked out. `snapshot` is the list as delivered, for spotting changes.
  let apps = [], cards = [], snapshot = "";
  function load(list) {
    const sorted = list.slice().sort((a, b) => a.name.localeCompare(b.name));
    snapshot = JSON.stringify(sorted);
    apps = sorted.map((a) => {
      const isNew = recent(a.added);
      return { ...a, isNew, isUpdated: !isNew && recent(a.updated) && (!a.added || a.updated > a.added) };
    });
  }

  // The card's version and last-update line, from what the publish workflow
  // recorded in gallery.json: "V00.01.025 · Updated 27 Nov". An app with no
  // version shows only the date; one never updated, the date it was added.
  function meta(app) {
    const when = app.updated ? "Updated " + longDate(app.updated) : app.added ? "Added " + longDate(app.added) : "";
    const text = [app.version, when].filter(Boolean).join(" · ");
    return text ? el("p", { className: "meta" }, text) : "";
  }

  function card(app) {
    const img = app.icon
      ? el("img", { className: "icon", src: app.icon, alt: "", loading: "lazy" })
      : el("div", { className: "icon", ariaHidden: "true" }, app.name[0]);
    const icon = el("span", { className: "icon-wrap" }, img);
    if (app.isNew || app.isUpdated) {
      const what = app.isNew ? "Added " + shortDate(app.added) : "Updated " + shortDate(app.updated);
      icon.append(el("span", { className: "badge", title: what }, "New"));
    }
    const li = el("li", { className: "card" },
      el("div", { className: "head" }, icon,
        el("h2", {}, el("a", { href: app.url }, app.name)),
        app.locked ? el("span", { className: "lock", title: "Password protected" }, "🔒") : ""),
      el("p", { className: "desc" }, app.description || ""),
      meta(app),
      el("div", { className: "foot" },
        el("div", { className: "tags" }, ...(app.tags || []).map(t => el("span", { className: "tag" }, t))),
        el("div", { className: "links" },
          IOS ? installButton(app) : downloadLink(app),
          app.source ? el("a", { href: app.source, target: "_blank", rel: "noopener" }, "Source") : ""
        )
      )
    );
    if (app.accent) li.style.setProperty("--accent", app.accent);
    li.dataset.search = [app.name, app.description, ...(app.tags || [])].join(" ").toLowerCase();
    return li;
  }

  function fileUrl(app) {
    if (app.file !== undefined) return app.file;
    return app.url.endsWith("/") ? app.url + "index.html" : app.url;
  }

  // The download attribute is ignored for cross-origin links and for pages
  // opened from disk, which would just navigate to the app. Fetching the file
  // and saving it as a blob gives a real download with a readable filename.
  // If the fetch fails, fall back to opening the file so it can be saved
  // by hand.
  function downloadLink(app) {
    const href = fileUrl(app);
    if (!href) return "";
    const filename = app.name.toLowerCase().replace(/['’]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".html";
    const a = el("a", { href, download: filename, title: "Save a copy that runs offline" }, "Download");
    a.addEventListener("click", async (e) => {
      e.preventDefault();
      try {
        const res = await fetch(href);
        if (!res.ok) throw new Error(res.status);
        const blobUrl = URL.createObjectURL(await res.blob());
        const tmp = el("a", { href: blobUrl, download: filename });
        tmp.click();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      } catch {
        window.open(href, "_blank", "noopener");
      }
    });
    return a;
  }

  // iPhones and iPads can't run a downloaded HTML file (Files only previews
  // it), so there the Download link becomes an Install button that explains
  // Add to Home Screen. iPadOS reports itself as a Mac; the touch points give
  // it away.
  const IOS = /iP(hone|ad|od)/.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const dialog = document.getElementById("install");
  document.getElementById("install-close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });

  const SHARE_ICON = '<svg class="share" viewBox="0 0 15 18" aria-label="Share" role="img" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 1v11M3.5 5l4-4 4 4M5 8H2.5v9h10V8H10"/></svg>';

  function installButton(app) {
    const b = el("button", { type: "button", title: "Add to your home screen" }, "Install");
    b.addEventListener("click", () => showInstall(app));
    return b;
  }

  // Add to Home Screen has to be done from the app's own page, or it adds the
  // gallery instead. In the home-screen copy of the gallery (standalone) there
  // is no Share button at all, so the app has to be opened in Safari.
  function showInstall(app) {
    const icon = document.getElementById("install-icon");
    icon.hidden = !app.icon;
    if (app.icon) icon.src = app.icon;
    document.getElementById("install-title").textContent = "Install " + app.name;
    const body = document.getElementById("install-body");
    const go = document.getElementById("install-go");
    const appUrl = new URL(app.url, location.href).href;
    const lockNote = app.locked
      ? "<p>The home-screen copy keeps its own storage, so it asks for the password once more the first time it opens.</p>" : "";
    go.onclick = null;
    if (navigator.standalone) {
      body.innerHTML = "<ol><li>Tap <b>Copy link</b>.</li><li>Open Safari and paste it into the address bar.</li>"
        + "<li>In Safari, tap " + SHARE_ICON + " <b>Share</b>, then <b>Add to Home Screen</b>.</li></ol>"
        + "<p>Apps can't be added from the home-screen gallery, only from Safari.</p>" + lockNote;
      go.removeAttribute("href");
      go.textContent = "Copy link";
      go.onclick = async () => {
        try { await navigator.clipboard.writeText(appUrl); go.textContent = "Copied"; }
        catch { body.insertAdjacentHTML("beforeend", "<p>Copy this link by hand: <b></b></p>"); body.lastElementChild.querySelector("b").textContent = appUrl; }
      };
    } else {
      body.innerHTML = "<ol><li>Tap <b>Open " + app.name.replace(/[&<>]/g, "") + "</b>.</li>"
        + "<li>Tap " + SHARE_ICON + " <b>Share</b> in Safari's toolbar (on iOS 26, it's under the <b>⋯</b> button).</li>"
        + "<li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>" + lockNote;
      go.href = app.url;
      go.textContent = "Open " + app.name;
    }
    dialog.showModal();
  }

  // Show filters: one of All / New / Updates / Public, combined with a
  // category (any of the apps' tags) and the search box.
  const SHOWS = {
    all: () => true,
    new: (a) => a.isNew || a.isUpdated,
    updated: (a) => a.isUpdated,
    public: (a) => !a.locked,
  };
  let show = "all";
  const chips = [...document.querySelectorAll(".chip")];
  for (const chip of chips) {
    if (chip.dataset.show !== "all") chip.append(el("span", { className: "n" }));
    chip.addEventListener("click", () => {
      show = chip.dataset.show;
      for (const c of chips) c.setAttribute("aria-pressed", String(c === chip));
      filter();
    });
  }
  const category = document.getElementById("category");
  category.addEventListener("change", filter);

  // Draws the cards, chip counts and category menu from `apps`. Runs on load
  // and again whenever a refresh brings a different list; the chosen filter,
  // category and search survive it.
  function render() {
    cards = apps.map(card);
    grid.replaceChildren(...cards);
    for (const chip of chips) {
      const n = chip.querySelector(".n");
      if (n) n.textContent = apps.filter(SHOWS[chip.dataset.show]).length;
    }
    const chosen = category.value;
    const tags = [...new Set(apps.flatMap((a) => a.tags || []))].sort((a, b) => a.localeCompare(b));
    category.replaceChildren(category.options[0],
      ...tags.map((t) => el("option", { value: t }, t[0].toUpperCase() + t.slice(1))));
    category.value = tags.includes(chosen) ? chosen : "";
    category.hidden = tags.length === 0;
    filter();
  }

  function filter() {
    const term = q.value.trim().toLowerCase();
    const tag = category.value;
    let shown = 0;
    for (const [i, c] of cards.entries()) {
      const app = apps[i];
      const match = SHOWS[show](app) && (!tag || (app.tags || []).includes(tag))
        && (!term || c.dataset.search.includes(term));
      c.hidden = !match;
      if (match) shown++;
    }
    empty.hidden = shown > 0;
  }
  q.addEventListener("input", filter);

  // apps.js arrives through a plain <script> tag, which GitHub Pages lets
  // browsers cache for ten minutes, and the home-screen gallery is often
  // resumed rather than reloaded, so either can show an old list after a
  // deploy. apps.json is the same list, fetched with no-store and a unique
  // query so it always comes from the server. Opened from disk or offline,
  // the fetch fails and the list from apps.js stays.
  let lastChecked = 0;
  async function refresh({ quiet = false } = {}) {
    if (refreshBtn.getAttribute("aria-busy") === "true") return;
    refreshBtn.setAttribute("aria-busy", "true");
    if (!quiet) statusEl.textContent = "Checking for updates…";
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    try {
      const res = await fetch("apps.json?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal });
      if (!res.ok) throw new Error(res.status);
      const fresh = await res.json();
      if (!Array.isArray(fresh)) throw new Error("bad catalogue");
      lastChecked = Date.now();
      const before = new Set(apps.map((a) => a.url));
      const added = fresh.filter((a) => !before.has(a.url)).map((a) => a.name);
      const previous = snapshot;
      load(fresh);
      const changed = snapshot !== previous;
      if (changed) render();
      statusEl.textContent = added.length ? "New: " + added.join(", ")
        : changed ? "List updated" : quiet ? "" : "Up to date";
    } catch {
      if (!quiet) statusEl.textContent = location.protocol === "file:"
        ? "Opened from a file: Refresh works on the online gallery"
        : "Couldn’t reach the gallery. Check your connection.";
    } finally {
      clearTimeout(timer);
      refreshBtn.removeAttribute("aria-busy");
    }
  }
  refreshBtn.addEventListener("click", () => refresh());
  // Check again when the gallery comes back to the front, at most once a
  // minute.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && Date.now() - lastChecked > 60000) refresh({ quiet: true });
  });

  load(window.APPS || []);
  render();
  if (location.protocol !== "file:") refresh({ quiet: true });
</script>
</body>
</html>
