# Publishes the gallery to GitHub Pages on every push to main.
#
# apps.js is generated here from the folders in apps/ rather than committed,
# so a publish from the private repo only has to write apps/<name>/.
name: Deploy gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a deploy still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build catalogue
        run: node scripts/build-catalog.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # deploy-pages looks the artifact up straight after the upload, and
      # GitHub's artifact list sometimes hasn't caught up yet: the run fails
      # with "No artifacts named github-pages were found" though the upload
      # succeeded. Re-running works, so do that here after a pause.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
